.couple-paper { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.couple-paper img { display: block; width: 100%; height: 100%; object-fit: cover; }
.couple-desktop-flowers { display: none; }
.couple-heading { position: relative; text-align: center; }
.couple-heading h2 { margin: 0; font-family: var(--font-serif); font-size: var(--invite-heading); font-weight: 400; line-height: 1.2; letter-spacing: -.035em; }
.couple-heading .ornament { width: 116px; height: 16px; margin: 10px auto 12px; }
.couple-heading > p { margin: 0; font-family: var(--font-serif); font-size: var(--invite-body); line-height: 1.7; }
.couple-profiles { width: min(100%, 440px); margin: 40px auto 0; }
.couple-profile { position: relative; display: grid; grid-template-columns: clamp(96px, 30vw, 120px) minmax(0, 1fr); column-gap: 14px; align-items: start; }
.couple-profile + .couple-profile { margin-top: 52px; }
.couple-profile-copy { position: relative; z-index: 1; min-width: 0; }
.couple-monogram { position: relative; width: 100%; height: 120px; pointer-events: none; }
.couple-monogram img { position: absolute; top: calc((120px - clamp(96px, 30vw, 120px) - 8px) / 2); left: 50%; width: calc(100% + 8px); max-width: none; height: auto; transform: translateX(-50%); }
.couple-monogram > span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-names); font-size: 58px; font-weight: 400; line-height: 1; }
.couple-profile-bride .couple-monogram > span { font-family: 'Pinyon Script', var(--font-names); }
.couple-vine { position: absolute; top: 105px; bottom: -70px; left: calc(clamp(96px, 30vw, 120px) / 2 - 50px); width: 100px; overflow: hidden; pointer-events: none; }
.couple-vine img { display: block; width: 100px; height: auto; }
.couple-vine-final { bottom: -12px; }
.couple-role { margin: 0; color: var(--invite-muted); font-family: var(--font-serif); font-size: 12px; font-weight: 500; line-height: 14px; letter-spacing: .19em; }
.couple-profile-name { margin: 8px 0 0; font-family: var(--font-names); font-size: clamp(48px, 15.4vw, 60px); font-weight: 400; line-height: .9; letter-spacing: normal; overflow-wrap: normal; }
.couple-profile-bride .couple-profile-name { line-height: 1; }
.couple-profile-bride .couple-profile-name::first-letter { font-family: 'Pinyon Script', var(--font-names); }
.couple-relation { margin: 10px 0 0; font-family: var(--font-serif); font-size: 16px; line-height: 24px; }
.couple-parents { margin: 8px 0 0; font-family: var(--font-serif); font-size: 16px; line-height: 25px; }
.couple-parents > span { display: block; overflow-wrap: anywhere; }

@media (min-width: 601px) and (max-width: 1023px) {

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wedding sharing artwork · 1200 × 630</title>
  <style>
    @font-face { font-family: 'Great Vibes'; src: url('../public/fonts/great-vibes.woff2'); }
    @font-face { font-family: 'Lora'; src: url('../public/fonts/lora.woff2'); }
    @font-face { font-family: 'Manrope'; src: url('../public/fonts/manrope.woff2'); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { background: #f6f0e6 url('../public/images/scene-desktop.webp') center / cover; color: #503719; text-align: center; }
    main { position: absolute; inset: 35px 40px; border: 1px solid #a3834f88; }
    main::before { content: ''; position: absolute; inset: 7px; border: 1px solid #a3834f44; pointer-events: none; }
    .content { position: absolute; inset: 45px 70px 35px; display: flex; flex-direction: column; align-items: center; }
    .eyebrow { margin: 0 0 18px; font: 500 15px 'Manrope', sans-serif; letter-spacing: 5px; color: #775a35; }
    h1 { margin: 0; font: 400 82px/1.06 'Great Vibes', cursive; }
    h1 span { display: block; }
    h1 small { display: block; margin: 0; color: #96713b; font: italic 34px/1.05 'Lora', serif; }
    .rule { width: 124px; height: 1px; margin: 23px 0 20px; background: #a3834f99; }
    .date { margin: 0; font: 400 27px/1.4 'Lora', serif; }
    .venue { margin: 10px 0 0; font: 400 17px/1.5 'Manrope', sans-serif; color: #715638; }
    .closing { margin: 23px 0 0; font: italic 17px 'Lora', serif; color: #715638; }
  </style>
</head>
<body>
  <main>
    <div class="content">
      <p class="eyebrow">YOU ARE INVITED TO OUR NIKKAH</p>
      <h1><span>Amina S</span><small>&amp;</small><span>Sakeer Hussain S</span></h1>
      <div class="rule"></div>
      <p class="date">24 December 2026</p>
      <p class="venue">Sana Auditorium · Kollam, Kerala</p>
      <p class="closing">With love, we invite you to celebrate with us.</p>
    </div>
  </main>
</body>
</html>
